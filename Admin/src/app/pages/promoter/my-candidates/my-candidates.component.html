<div class="container-fluid">
    <!-- Titre de la page -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="page-title-box d-flex align-items-center justify-content-between">
                <h4 class="mb-0">Gestion des Candidats</h4>
                <div class="page-title-right">
                    <ol class="breadcrumb m-0">
                        <li class="breadcrumb-item"><a href="javascript: void(0);">Dashboard</a></li>
                        <li class="breadcrumb-item active">Candidats</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>

  <div class="row justify-content-end mb-3">
    <div class="col-md-4 text-end">
      <button class="btn btn-soft-primary waves-effect waves-light mx-2" 
              (click)="openCreatePopup()"
              matTooltip="Create new candidate">
        <i class="bx bx-plus"></i> Add Candidate
      </button>
      <button class="btn btn-soft-primary waves-effect waves-light" matTooltip="Export data">
        <i class="bx bx-export"></i> Export
      </button>
    </div>
  </div>

  <div class="row">
    <div *ngFor="let stat of followUpStat" class="col-md-4">
      <app-stat [title]="stat.title" [value]="stat.value" [icon]="stat.icon"></app-stat>
    </div>
  </div>

  <div class="row mt-3">
    <div class="col-md-12">
      <div class="card">
        <div class="card-body">
          <div class="row justify-content-between mb-3">
            <div class="col-md-4">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Filter candidates</mat-label>
                <input matInput 
                      (keyup)="applyFilter($event)" 
                      #input
                      placeholder="Search by name or email">
                <mat-icon matSuffix>search</mat-icon>
              </mat-form-field>
            </div>
            <div class="col-md-2 text-end">
              <button mat-icon-button matTooltip="Refresh list" (click)="loadCandidates()">
                <mat-icon>refresh</mat-icon>
              </button>
            </div>
          </div>

          <mat-tab-group (selectedTabChange)="onTabChange($event)">
            <mat-tab *ngFor="let center of trainingCenters" [label]="center.fullName">
              <div *ngIf="loadingCandidates" class="text-center my-4">
                <mat-spinner></mat-spinner>
              </div>
              <div *ngIf="!loadingCandidates">
                <div *ngIf="candidatesByCenter[center.fullName]?.length > 0; else noCandidates">
          <div class="table-responsive">
                    <table mat-table [dataSource]="candidatesByCenter[center.fullName]" class="w-100">
              <!-- Name Column -->
              <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef> Name </th>
                <td mat-cell *matCellDef="let candidate"> 
                          <span class="fw-semibold d-flex align-items-center">
                            <ng-container *ngIf="candidate.profilePictureUrl; else noPhoto">
                              <img [src]="candidate.profilePictureUrl" alt="Photo" class="rounded-circle me-2" width="32" height="32" style="object-fit:cover;">
                            </ng-container>
                            <ng-template #noPhoto>
                              <mat-icon class="me-2">account_circle</mat-icon>
                            </ng-template>
                            {{candidate.firstname}} {{candidate.lastname}}
                          </span>
                </td>
              </ng-container>
              <!-- Email Column -->
              <ng-container matColumnDef="email">
                        <th mat-header-cell *matHeaderCellDef> Email </th>
                <td mat-cell *matCellDef="let candidate"> 
                  {{candidate.email}}
                </td>
              </ng-container>
              <!-- Status Column -->
              <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef> Status </th>
                <td mat-cell *matCellDef="let candidate"> 
                  <span class="badge" [ngClass]="{
                    'bg-success': candidate.contentStatus === 'APPROVED',
                    'bg-warning': candidate.contentStatus === 'PENDING_REVIEW',
                    'bg-secondary': candidate.contentStatus === 'DRAFT'
                  }">
                    {{candidate.contentStatus}}
                  </span>
                </td>
              </ng-container>
              <!-- Actions Column -->
              <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="text-end"> Actions </th>
                <td mat-cell *matCellDef="let candidate" class="text-end">
                  <div class="d-flex justify-content-end">
                    <button mat-icon-button color="accent"
                            matTooltip="Edit"
                            (click)="edit(candidate)">
                      <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn"
                            matTooltip="Delete"
                            (click)="delete(candidate)"
                            [disabled]="processing">
                      <mat-icon>delete</mat-icon>
                    </button>
                  </div>
                </td>
              </ng-container>
                      <tr mat-header-row *matHeaderRowDef="['name', 'email', 'status', 'actions']"></tr>
                      <tr mat-row *matRowDef="let row; columns: ['name', 'email', 'status', 'actions'];"></tr>
                    </table>
                  </div>
                </div>
                <ng-template #noCandidates>
                  <div class="text-center my-4 text-muted">Aucun candidat pour ce centre</div>
                </ng-template>
          </div>
            </mat-tab>
          </mat-tab-group>

          <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" 
                        showFirstLastButtons
                        aria-label="Select page of candidates"
                        class="mt-3">
          </mat-paginator>
        </div>
      </div>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <!-- Modal supprimé, remplacé par SweetAlert2 -->
  <!-- Fin du code modal -->
</div>
